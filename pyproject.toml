[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "multimodal-annotation-qa"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["streamlit>=1.32,<2"]
[project.optional-dependencies]
test = ["pytest>=7,<10"]
[tool.setuptools.packages.find]
where = ["src"]
